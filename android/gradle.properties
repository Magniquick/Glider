org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier was removed in AGP 9; no dependency here still needs support-library rewriting.
# Built-in Kotlin stays off. AGP 9.1.0 (and 9.3.1) bundle Kotlin 2.2.10, but
# Flutter 3.47 refuses to build below 2.2.20:
#   Your project's Kotlin version (2.2.10) is lower than Flutter's minimum
#   supported version of 2.2.20.
# So the Kotlin Gradle Plugin is still applied explicitly, pinned to 2.4.0 in
# settings.gradle.kts. Revisit when AGP ships a bundled Kotlin >= 2.2.20.
android.newDsl=false
android.builtInKotlin=false
android.suppressUnsupportedCompileSdk=37
# Task output cache, on disk under ~/.gradle/caches/build-cache-1, which is
# inside the path CI already caches. Worth having for the two tasks that
# dominate a release build: minifyReleaseWithR8 (15.7s) and compileReleaseKotlin.
org.gradle.caching=true
# Ten plugin modules configure and compile independently of each other.
org.gradle.parallel=true
# No configuration cache. Flutter's own Gradle plugin is not compatible:
# `:app:ReleaseMinSdkCheck` captures Project and a KGP BuildService at
# execution time, which the configuration cache forbids. Verified against
# Gradle 9.3.1 with `--configuration-cache --dry-run` on 2026-09-02; it fails
# with 6 problems, all inside that one task. Recheck after a Flutter upgrade.
