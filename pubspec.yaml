name: glider
description: An opinionated Hacker News client.
version: 2.9.0+50
publish_to: none

workspace:
  - packages/glider_data
  - packages/glider_domain

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  bloc: ^9.2.1
  bloc_presentation: ^1.1.2
  clock: ^1.1.2
  collection: any
  cronet_http: ^1.9.0
  device_info_plus: ^13.2.0
  dynamic_color: ^1.9.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.3.0
  formz: ^0.8.1
  glider_data:
    path: packages/glider_data
  glider_domain:
    path: packages/glider_domain
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  hydrated_bloc: ^11.0.0
  intl: any
  markdown: ^7.3.1
  material_color_utilities: any
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pub_semver: ^2.2.0
  rxdart: ^0.28.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  super_sliver_list: ^0.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  melos: ^8.3.0
  leancode_lint: ^27.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # google_fonts only uses a bundled file instead of fetching over the network
    # if it is declared as an asset under a Google-Fonts filename. Noto Sans is
    # the default font, so bundling it means a fresh install renders without
    # contacting fonts.gstatic.com. Fonts the user picks are still fetched.
    - assets/google_fonts/
    # Domain -> Simple Icons slug index, generated by
    # tool/update_simple_icons_map.py. Covers roughly a fifth of the links on
    # a given Hacker News front page; the rest fall through to favicons.
    - assets/simple_icons/domains.json
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansMono
      fonts:
        - asset: assets/fonts/NotoSansMono-Regular.ttf

melos:
  ide:
    intellij:
      enabled: false

  scripts:
    lint:
      run: |
        dart run melos run analyze
        dart run melos run format-check
      description: Run all static analysis checks.

    analyze:
      # Run once from the workspace root: pub workspaces exclude the root
      # package from melos' package list, so a per-package `exec` would skip
      # the app itself. `dart analyze .` covers the root and both packages.
      #
      # Fatal on errors only. Three `missing_equatable_props` reports are false
      # positives -- the members they name are memoised derivations of fields
      # already in `props`, so listing them would force an O(n) recomputation
      # on every state comparison without changing any outcome. leancode_lint
      # runs as an analysis-server plugin, and plugin diagnostics honour
      # neither `// ignore:` comments nor `analyzer: errors:`, so those three
      # cannot be silenced individually.
      run: dart analyze . --no-fatal-warnings
      description: Analyze the whole workspace.

    format:
      run: dart format .
      description: Format the whole workspace.

    format-check:
      run: dart format . --set-exit-if-changed
      description: Check formatting across the whole workspace.

    test:
      # Pub workspaces exclude the root package from melos' package list, so the
      # app's own tests need running separately from the members'.
      run: |
        dart run melos run test:app
        dart run melos run test:packages
      description: Run every test in the workspace.

    test:app:
      run: flutter test
      description: Run the app's tests.

    test:packages:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        dirExists: test
      description: Run tests in every package that has them.

    outdated:
      run: flutter pub outdated
      description: Report outdated dependencies.
