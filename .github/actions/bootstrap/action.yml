name: Bootstrap
description: Bootstrap workspace
runs:
  using: composite
  steps:
    - name: Set up toolchain (Flutter, Java, Android SDK)
      # Versions come from mise.toml, so CI and local development stay in sync.
      uses: jdx/mise-action@v2
      with:
        cache: true
    - name: Cache pub
      uses: actions/cache@v4
      with:
        path: .pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: ${{ runner.os }}-pub-
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
    - name: Bootstrap workspace
      shell: bash
      # melos is a dev_dependency, so its version is pinned by pubspec.lock
      # rather than floating on whatever `pub global activate` resolves.
      run: |
        flutter pub get
        dart run melos bootstrap
