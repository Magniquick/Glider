name: Bootstrap
description: Bootstrap workspace
runs:
  using: composite
  steps:
    - name: Set up toolchain (Flutter, Java, Android SDK)
      # Versions come from mise.toml, so CI and local development stay in sync.
      uses: jdx/mise-action@v2
      with:
        cache: true
    - name: Cache pub
      uses: actions/cache@v4
      with:
        path: .pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: ${{ runner.os }}-pub-
    - name: Set up Melos
      shell: bash
      run: |
        dart pub global activate melos
        echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"
    - name: Bootstrap workspace
      shell: bash
      run: melos bootstrap
