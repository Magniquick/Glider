name: Bootstrap
description: Bootstrap workspace
inputs:
  android:
    description: >
      Install the Android SDK components and restore the Gradle cache. Set to
      false for jobs that only run Dart, which saves about 50s of SDK install
      and cache restore they would never use.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up toolchain (Flutter, Java, Android SDK)
      # Versions come from mise.toml, so CI and local development stay in sync.
      uses: jdx/mise-action@v4
      with:
        cache: true
    # There is deliberately no cache for the SDK components below. Measured on
    # 2026-09-01: restoring the 1.07 GiB cache took 30.1s while installing them
    # from scratch took 25.5s, so the cache was a net loss that also ate a
    # quarter of the repository's cache budget and evicted entries that do pay
    # for themselves. Re-measure before adding one back.
    - name: Install Android SDK components and accept licences
      if: inputs.android == 'true'
      shell: bash
      # mise's android-sdk provides cmdline-tools only, and it exports
      # ANDROID_HOME at its own install, which shadows the runner's preinstalled
      # SDK and its accepted licences. Without this the Gradle build fails with
      # LicenceNotAcceptedException.
      #
      # The platform is `android-37.0`, not `android-37`. Platforms carry a
      # minor version now and there is no package under the bare name, but
      # sdkmanager exits 0 when asked for a package that does not exist, so
      # naming it wrong installed nothing and said nothing. Gradle then
      # auto-downloaded the platform mid-build and failed against it before the
      # download finished. Hence the check below rather than trusting the exit
      # code, and no redirect to /dev/null hiding what it says.
      #
      # The NDK is not optional: cronet_http pulls in package:jni, whose
      # android/build.gradle runs an externalNativeBuild against
      # `flutter.ndkVersion`.
      run: |
        set -euo pipefail
        packages=(
          "platforms;android-37.0"
          "platforms;android-36"
          "build-tools;36.1.0"
          "build-tools;36.0.0"
          "platform-tools"
          "ndk;28.2.13676358"
        )
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --install "${packages[@]}"
        missing=0
        for package in "${packages[@]}"; do
          if [ ! -d "$ANDROID_HOME/${package//;//}" ]; then
            echo "::error::Android SDK component missing after install: $package"
            missing=1
          fi
        done
        exit "$missing"
    - name: Cache pub
      uses: actions/cache@v6
      with:
        path: .pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: ${{ runner.os }}-pub-
    # Two entries, because the Gradle home holds two kinds of thing and they
    # want opposite keys. Measured 2026-09-02: modules-2 and the per-version
    # internals are 3.3 GiB, build-cache-1 is 48 MiB.
    #
    # Dependencies and Gradle's own internals are fully determined by the
    # dependency set and the wrapper version, so a content key is exactly right
    # and the entry should be written once and then hit forever.
    - name: Cache Gradle dependencies
      if: inputs.android == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          !~/.gradle/caches/build-cache-1
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-deps-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-deps-
    # The task output cache is the opposite: its value grows with every build,
    # so it has to be rewritten each time. `actions/cache` saves only when the
    # primary key missed, and entries are immutable, so the run id forces that
    # miss while restore-keys do the actual restoring by prefix. Keeping this
    # separate is what makes the rewrite ~50 MiB instead of ~1.45 GiB.
    - name: Cache Gradle build outputs
      if: inputs.android == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.gradle/caches/build-cache-1
        key: ${{ runner.os }}-gradle-build-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-gradle-build-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}-
          ${{ runner.os }}-gradle-build-
    - name: Bootstrap workspace
      shell: bash
      # melos is a dev_dependency, so its version is pinned by pubspec.lock
      # rather than floating on whatever `pub global activate` resolves.
      run: |
        flutter pub get
        dart run melos bootstrap
