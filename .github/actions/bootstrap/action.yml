name: Bootstrap
description: Bootstrap workspace
runs:
  using: composite
  steps:
    - name: Set up toolchain (Flutter, Java, Android SDK)
      # Versions come from mise.toml, so CI and local development stay in sync.
      uses: jdx/mise-action@v2
      with:
        cache: true
    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: ~/.local/share/mise/installs/android-sdk
        key: ${{ runner.os }}-android-sdk-${{ hashFiles('mise.toml', '.github/actions/bootstrap/action.yml') }}
        restore-keys: ${{ runner.os }}-android-sdk-
    - name: Install Android SDK components and accept licences
      shell: bash
      # mise's android-sdk provides cmdline-tools only, and it exports
      # ANDROID_HOME at its own install, which shadows the runner's preinstalled
      # SDK and its accepted licences. Without this the Gradle build fails with
      # LicenceNotAcceptedException.
      #
      # Runs after the cache restore, not before: restoring unpacks over
      # ANDROID_HOME and would undo anything installed first.
      #
      # The platform is `android-37.0`, not `android-37`. Platforms carry a
      # minor version now and there is no package under the bare name -- but
      # sdkmanager exits 0 when asked for a package that does not exist, so
      # naming it wrong installed nothing and said nothing. Gradle then
      # auto-downloaded the platform mid-build and failed against it before the
      # download finished. Hence the check below rather than trusting the exit
      # code, and no redirect to /dev/null hiding what it says.
      run: |
        set -euo pipefail
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --install \
          "platforms;android-37.0" \
          "platforms;android-36" \
          "build-tools;36.1.0" \
          "build-tools;36.0.0" \
          "platform-tools" \
          "ndk;28.2.13676358"
        missing=0
        for path in \
          "platforms/android-37.0" \
          "platforms/android-36" \
          "build-tools/36.1.0" \
          "build-tools/36.0.0" \
          "ndk/28.2.13676358"
        do
          if [ ! -d "$ANDROID_HOME/$path" ]; then
            echo "::error::Android SDK component missing after install: $path"
            missing=1
          fi
        done
        exit "$missing"
    - name: Cache pub
      uses: actions/cache@v4
      with:
        path: .pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: ${{ runner.os }}-pub-
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-gradle-
    - name: Bootstrap workspace
      shell: bash
      # melos is a dev_dependency, so its version is pinned by pubspec.lock
      # rather than floating on whatever `pub global activate` resolves.
      run: |
        flutter pub get
        dart run melos bootstrap
