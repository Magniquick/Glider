name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  guard:
    # This pipeline needs the upstream maintainer's signing key. A fork has no
    # such secret, so without this the workflow fails on every tag push. Secrets
    # cannot be read from a job-level `if`, hence a job that turns one into an
    # output.
    name: Check for signing secrets
    runs-on: ubuntu-latest
    outputs:
      signable: ${{ steps.check.outputs.signable }}
    steps:
      - name: Look for a keystore secret
        id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo 'signable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signable=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No ANDROID_KEYSTORE_BASE64 secret is configured, so there is no key to sign a release with. Skipping. Cut releases manually with `gh release create` instead.'
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.signable == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bootstrap workspace
        uses: ./.github/actions/bootstrap
      - name: Get Android keystore
        id: android-keystore
        uses: timheuer/base64-to-file@v2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Create key.properties
        uses: GuillaumeFalourd/write-java-properties-file@v1.1
        with:
          file_path: ./android/key.properties
          property: |
            storeFile
            storePassword
            keyPassword
            keyAlias
          value: |
            ${{ steps.android-keystore.outputs.filePath }}
            ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ${{ secrets.ANDROID_KEY_PASSWORD }}
            ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Build Android APK
        run: flutter build apk
      - name: Build Android App Bundle
        run: flutter build appbundle
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: build/app/outputs/apk/release/app-release.apk
      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
  # Deliberately outside the `guard` gate. That gate exists because Android
  # cannot be released without the upstream maintainer's keystore, but an
  # unsigned IPA needs no secret at all, so this fork can ship an iOS build
  # even though it cannot ship a signed Android one.
  #
  # Nobody can install this artifact by tapping it. It is re-signed on the way
  # in by Sideloadly, AltStore or TrollStore against whatever Apple ID the
  # installer holds, and a free Apple ID gives it a seven-day life. That works
  # only because the app declares no entitlements: no push, no app groups, no
  # keychain sharing, no associated domains. A free account can grant none of
  # those, so adding one later breaks sideloading for everybody without a paid
  # developer account, and it breaks it here rather than at build time.
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    # Same reason as the CI iOS job: mise.toml is shared with the Android side,
    # and an iOS build touches neither the Android SDK nor a JDK.
    env:
      MISE_DISABLE_TOOLS: android-sdk,java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bootstrap workspace
        uses: ./.github/actions/bootstrap
        with:
          android: 'false'
      # `flutter build ipa` is the wrong command here. Without a signing
      # identity it stops after writing the .xcarchive and never runs the
      # export step, so it produces no IPA and does not fail either. `build
      # ios` leaves an unsigned Runner.app behind instead, and an IPA is only
      # ever a zip holding that bundle under Payload/.
      - name: Build unsigned Runner.app
        run: flutter build ios --release --no-codesign
      - name: Package it as an IPA
        id: package
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          name="Glider-$version-unsigned.ipa"
          mkdir -p build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/
          # -y stores symlinks instead of following them, which keeps any
          # embedded framework a bundle rather than several copies of itself.
          (cd build/ios && zip -qry "$name" Payload)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=build/ios/$name" >> "$GITHUB_OUTPUT"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
      # Releases in this fork are cut by hand after the tag is pushed, so when
      # this runs on the tag there is usually no release to attach to yet.
      # Attaching is therefore best effort, and the artifact above is the thing
      # that always exists. Creating the release here instead would race the
      # manual one and publish it with no notes and without --prerelease.
      - name: Attach to the release, if one exists yet
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IPA: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            echo "::notice::No release exists for $TAG yet, so the IPA is only a workflow artifact. Attach it with: gh release upload $TAG $(basename "$IPA")"
          fi

  release-github:
    name: Release to GitHub
    runs-on: ubuntu-latest
    needs: [guard, build]
    # An explicit `if` replaces the implicit `success()`, so without the guard
    # check this job would still run when `build` was skipped for want of a
    # signing key, and then fail on the artifact that was never produced.
    if: needs.guard.outputs.signable == 'true' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Parse pubspec
        id: pubspec
        uses: altive/pubspec-metadata@v1
      - name: Get artifact
        id: download-artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release.apk
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: fastlane/metadata/android/en-US/changelogs/${{ steps.pubspec.outputs.build-number }}.txt
          files: app-release.apk
