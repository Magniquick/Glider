name: Update datasets
on:
  schedule:
    # Weekly. The public suffix list changes a few times a month and Simple
    # Icons ships most weeks, so anything more frequent is just churn.
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    name: Refresh vendored datasets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Refresh datasets
        run: |
          uv run tool/update_public_suffix_list.py
          uv run tool/update_simple_icons_map.py
      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-datasets
          title: Refresh vendored datasets
          # The generator fails loudly when an override names a slug that no
          # longer exists, so a red check here means a brand was renamed
          # upstream and the override table needs a look -- not that the data
          # is merely stale.
          body: |
            Regenerated by `melos run update-datasets`.

            - `assets/public_suffix_list.dat` from publicsuffix.org
            - `assets/simple_icons/domains.json` from the latest simple-icons

            Check the diff for domains that changed hands before merging.
          commit-message: Refresh vendored datasets
          add-paths: |
            assets/public_suffix_list.dat
            assets/simple_icons/domains.json
