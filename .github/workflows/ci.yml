name: CI
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
# A second push to the same branch makes the first one's result irrelevant, and
# three runs raced over the same cache keys on 2026-09-01. Keep the newest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Split from the Android build so the two run in parallel rather than adding
  # up. This one needs no Android SDK, which keeps ~50s of SDK install and
  # Gradle cache restore out of its critical path.
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bootstrap workspace
        uses: ./.github/actions/bootstrap
        with:
          android: 'false'
      - name: Run static analysis checks
        run: dart run melos run lint
      - name: Run tests
        run: dart run melos run test
  # Nothing had built iOS since 2024-04-02, across a Flutter 3.47 upgrade and a
  # near-total change of plugin set, so the project was free to rot unnoticed.
  # `--no-codesign` needs no signing identity, which is the whole point: this
  # proves the project still compiles without anyone holding a certificate.
  ios:
    name: Build iOS
    runs-on: macos-latest
    # mise.toml is shared with the Android side, so without this the mac runner
    # installs an Android SDK and a JDK that an iOS build never touches. Job
    # level so the composite action inherits it. Safe to scope here and not on
    # the ubuntu jobs: mise-action keys its cache by runner OS but not by tool
    # set, so disabling tools on the ubuntu analyze job would hand the Android
    # build job a cache with no SDK in it.
    env:
      MISE_DISABLE_TOOLS: android-sdk,java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bootstrap workspace
        uses: ./.github/actions/bootstrap
        with:
          android: 'false'
      # TEMPORARY, remove once the resulting patch is committed. `pod` and
      # xcodebuild exist only on this runner, so the deintegration Flutter has
      # been recommending on every build is performed here and exported through
      # the same drift patch below. If the build that follows fails, the change
      # is simply not committed and nothing is lost.
      - name: Deintegrate CocoaPods
        run: |
          set -euo pipefail
          cd ios
          pod deintegrate
          rm -f Podfile Podfile.lock
          cd ..
          # These are `#include?`, optional, which is why the build tolerates a
          # missing Pods directory today. They still have to go.
          sed -i '' '/Pods-Runner\..*\.xcconfig/d' ios/Flutter/Debug.xcconfig
          sed -i '' '/Pods-Runner\..*\.xcconfig/d' ios/Flutter/Release.xcconfig
          echo '--- Debug.xcconfig'; cat ios/Flutter/Debug.xcconfig
          echo '--- Release.xcconfig'; cat ios/Flutter/Release.xcconfig
      - name: Build iOS
        run: flutter build ios --no-codesign
      # Every build rewrites parts of ios/ on the runner and then discards them:
      # `pod install` regenerates the lock, and flutter itself runs migrations
      # (UIScene lifecycle, @UIApplicationMain to @main, Swift Package Manager
      # integration, the xcscheme). The work is redone from scratch on each run
      # and the repository never learns. Exporting the diff is the only way to
      # apply it from a Linux machine, where none of these tools can run.
      #
      # When this artifact stops appearing, the project has caught up and this
      # step can go.
      - name: Check whether the build changed anything under ios/
        id: drift
        if: always()
        run: |
          git diff -- ios/ > /tmp/ios-migration.patch || true
          if [ -s /tmp/ios-migration.patch ]; then
            git diff --stat -- ios/
            echo 'drifted=true' >> "$GITHUB_OUTPUT"
            echo '::warning::flutter migrated ios/ during the build, so the committed project is behind. Download the ios-migration-patch artifact and `git apply` it.'
          else
            echo 'drifted=false' >> "$GITHUB_OUTPUT"
            echo 'ios/ unchanged by the build'
          fi
      # Only uploaded when there is drift, so the artifact appearing at all is
      # the signal. Silence is the healthy state.
      - name: Upload the ios/ migration patch
        if: always() && steps.drift.outputs.drifted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-migration-patch
          path: /tmp/ios-migration.patch
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Looked up before bootstrapping, because a hit also makes the Android SDK
      # and the Gradle cache dead weight for this job.
      #
      # The key has to name everything the APK is built from, or a green check
      # stops meaning anything. Sources, the Android project, bundled assets,
      # the resolved dependency set, the toolchain versions, and the SDK
      # component list in the bootstrap action. A hit says these exact inputs
      # produced an APK on some earlier run, which is the same claim a fresh
      # build would make. Anything that can change the output and is NOT listed
      # here is a hole; add to the key rather than trusting the build to notice.
      - name: Restore a previously built APK
        id: apk
        uses: actions/cache@v6
        with:
          path: build/app/outputs/apk/profile/app-profile.apk
          key: >-
            ${{ runner.os }}-apk-profile-${{ hashFiles(
              'lib/**',
              'packages/**',
              'android/**',
              'assets/**',
              'pubspec.yaml',
              'pubspec.lock',
              'mise.toml',
              '.github/actions/bootstrap/action.yml'
            ) }}
      - name: Bootstrap workspace
        uses: ./.github/actions/bootstrap
        with:
          android: ${{ steps.apk.outputs.cache-hit != 'true' }}
      - name: Build Android APK (profile)
        if: steps.apk.outputs.cache-hit != 'true'
        run: flutter build apk --profile
      - name: Upload APK (profile) artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-profile.apk
          path: build/app/outputs/apk/profile/app-profile.apk
